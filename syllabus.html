<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syllabus — CIS 365</title>
<script>
(function () {
  var t = localStorage.getItem('cis365.theme');
  if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

<header class="topbar">

<footer class="site-footer">
  CIS 365 · Full Stack Web Development — content updated 2026.
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="js/nav.js" defer></script>
<script src="js/theme-toggle.js" defer></script>
<script src="js/markdown-render.js"></script>
<script>
  renderMarkdownFrom("content/syllabus.md")
    .then((html) => { document.getElementById("content").innerHTML = html; })

</script>
